# ============================================================
# 操盘手配置 — 短线(short) + 长线(long) 双组
# 每组独立资金池 ¥10,000
# ============================================================

traders:
  # ── 短线组：技术面为主，频繁交易 ──
  - name: "趋势跟随者"
    class: "trend_follower.TrendFollower"
    group: short
    active: true
    params:
      ma_short: 5
      ma_long: 20
      volume_ratio: 1.5
      stop_loss: -0.08
      max_positions: 3
      universe: all

  - name: "均值回归者"
    class: "mean_reversion.MeanReversion"
    group: short
    active: true
    params:
      rsi_oversold: 30
      rsi_overbought: 70
      bollinger_touch: lower
      max_hold_days: 10
      max_positions: 5
      universe: all

  - name: "宏观对冲者"
    class: "macro_hedger.MacroHedger"
    group: short
    active: true
    params:
      stock_weight: 0.5
      bond_weight: 0.3
      gold_weight: 0.2
      rebalance_threshold: 0.05
      shibor_shift: 0.005
      universe: macro

  # ── 长线组：基本面为主，低频持有 ──
  - name: "价值猎手"
    class: "value_hunter.ValueHunter"
    group: long
    active: true
    params:
      max_positions: 5
      pe_threshold: 0.7
      pb_max: 2.0
      take_profit: 0.30
      stop_loss: -0.15
      universe: hs300

  - name: "红利收集者"
    class: "dividend_collector.DividendCollector"
    group: long
    active: true
    params:
      min_dividend_yield: 0.03
      max_pb: 1.5
      sell_dividend_yield: 0.02
      max_positions: 3
      universe: dividend_index

  - name: "指数定投者"
    class: "index_dca.IndexDca"
    group: long
    active: true
    params:
      weekly_amount: 200.0
      etf_symbol: "510300"
      universe: etf
