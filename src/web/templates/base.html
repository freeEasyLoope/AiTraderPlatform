<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITrader · A股模拟投资</title>
    <!-- 内联 SVG 图标：项目原本没有 favicon，浏览器自动请求 /favicon.ico 会 404，
         控制台总有一条噪音错误；顺带让分享出去的链接有正经标签页图标。
         纯图形不含文字，不依赖字体。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230f172a'/%3E%3Crect%20x='6'%20y='18'%20width='5'%20height='8'%20rx='1.5'%20fill='%2338bdf8'/%3E%3Crect%20x='13.5'%20y='12'%20width='5'%20height='14'%20rx='1.5'%20fill='%2338bdf8'/%3E%3Crect%20x='21'%20y='6'%20width='5'%20height='20'%20rx='1.5'%20fill='%23818cf8'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/style.css?v={{ static_version() }}">
    <style>
        /* Page-specific augmentations — keep minimal */
        .page-subtitle { font-size:12px; color:var(--text3); margin-top:2px; }
    </style>
</head>
<body>
    <nav aria-label="主导航">
        <span class="logo">◆ AITrader</span>

        <div class="nav-group">
            <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}" aria-label="总览仪表盘">
                <span class="nav-icon">⊞</span> 总览
            </a>
            <a href="/strategies" class="{{ 'active' if request.url.path == '/strategies' else '' }}" aria-label="策略实验室">
                <span class="nav-icon">◈</span> 策略
            </a>
            <a href="/signals" class="{{ 'active' if request.url.path == '/signals' else '' }}" aria-label="信号简报">
                <span class="nav-icon">📡</span> 信号
            </a>
            <a href="/recommendations" class="{{ 'active' if request.url.path == '/recommendations' else '' }}" aria-label="自选分析">
                <span class="nav-icon">◎</span> 自选
            </a>
        </div>

        <span class="nav-divider"></span>

        <div class="nav-group">
            <a href="/risk-lab" class="{{ 'active' if request.url.path == '/risk-lab' else '' }}" aria-label="风险实验室">
                <span class="nav-icon">⚠</span> 风控
            </a>
            <a href="/challenge" class="{{ 'active' if request.url.path == '/challenge' else '' }}" aria-label="模拟挑战">
                <span class="nav-icon">🏆</span> 挑战
            </a>
            <a href="/screening" class="{{ 'active' if request.url.path.rstrip('/') == '/screening' else '' }}" aria-label="选股漏斗">
                <span class="nav-icon">⧩</span> 漏斗
            </a>
            <a href="/reports" class="{{ 'active' if request.url.path == '/reports' else '' }}" aria-label="交易日志与周报">
                <span class="nav-icon">▤</span> 日志
            </a>
            <a href="/control" class="{{ 'active' if request.url.path == '/control' else '' }}" aria-label="策略控制台">
                <span class="nav-icon">⚙</span> 控制
            </a>
        </div>

        <span id="dsStatus" title="数据源状态检测中...">◌ 检测中</span>
    </nav>

    <!-- #page-root 是异步导航的「内容交换边界」：站内跳转只替换它的内部 HTML。
         .container 挪到里面，样式与页面脚本的查询路径都不受影响。 -->
    <div id="page-root">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- 股票详情弹窗 -->
    <div class="modal-overlay" id="stockModal" onclick="if(event.target===this)closeModal()">
        <div class="modal" style="position:relative">
            <button class="close" onclick="closeModal()" aria-label="关闭">&times;</button>
            <h2 id="modalTitle"></h2>
            <div class="stock-stats" id="modalStats"></div>
            <div style="display:flex;gap:16px;flex-wrap:wrap">
                <div style="flex:1;min-width:200px">
                    <strong style="font-size:13px;color:var(--text2)">持有者</strong>
                    <div id="modalHolders" style="margin-top:8px;font-size:13px"></div>
                </div>
                <div style="flex:1;min-width:160px">
                    <strong style="font-size:13px;color:var(--text2)">估值指标</strong>
                    <div style="font-size:12px;color:var(--text3);margin-top:8px;line-height:1.8">
                        <span id="modalPE"></span><br><span id="modalPB"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- #page-scripts 是页面脚本的交换边界。必须与 #page-root 分开：
         部分模板的 <script> 写在 content 块里（如 screening.html），
         归到同一个边界里会让「内容」和「脚本」混在一起难以按序重放。 -->
    <div id="page-scripts">{% block scripts %}{% endblock %}</div>

    <!-- 确认对话框 -->
    <div class="confirm-overlay" id="confirmDialog">
        <div class="confirm-box">
            <h3 id="confirmTitle"></h3>
            <p id="confirmMsg"></p>
            <div class="btn-row">
                <button class="btn-ghost" onclick="closeConfirm()">取消</button>
                <button id="confirmBtn" onclick="execConfirm()">确认</button>
            </div>
        </div>
    </div>

    <script>
    // ── Confirm Dialog ──
    let _confirmCallback = null;
    function showConfirm(title, msg, callback) {
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmMsg').textContent = msg;
        _confirmCallback = callback;
        document.getElementById('confirmDialog').classList.add('show');
        document.getElementById('confirmBtn').focus();
    }
    function closeConfirm() {
        document.getElementById('confirmDialog').classList.remove('show');
        _confirmCallback = null;
    }
    function execConfirm() {
        if (_confirmCallback) { _confirmCallback(); _confirmCallback = null; }
        document.getElementById('confirmDialog').classList.remove('show');
    }
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeConfirm(); closeModal(); }
    });

    // ── Button Loading ──
    function setLoading(btn, loading, label) {
        if (loading) {
            btn._origText = btn.textContent;
            btn.disabled = true;
            btn.classList.add('loading');
            btn.textContent = label || '处理中...';
        } else {
            btn.disabled = false;
            btn.classList.remove('loading');
            btn.textContent = btn._origText || btn.textContent;
        }
    }

    // ── Stock Modal ──
    async function openStock(symbol) {
        const overlay = document.getElementById('stockModal');
        document.getElementById('modalTitle').textContent = symbol + ' 加载中...';
        document.getElementById('modalStats').innerHTML = '';
        document.getElementById('modalHolders').innerHTML = '';
        document.getElementById('modalPE').textContent = '';
        document.getElementById('modalPB').textContent = '';
        overlay.classList.add('show');
        try {
            const resp = await fetch('/api/stock/' + symbol);
            const d = await resp.json();
            document.getElementById('modalTitle').innerHTML =
                d.name + ' <span style="color:var(--text3);font-size:13px;font-weight:400">' + d.symbol + '</span>';
            const p = d.price;
            const stats = document.getElementById('modalStats');
            if (p) {
                const cls = p.change_pct >= 0 ? 'green' : 'red';
                const arrow = p.change_pct >= 0 ? '↑' : '↓';
                stats.innerHTML =
                    '<div class="stock-stat"><div class="v ' + cls + '">¥' + p.close.toFixed(2) + '</div><div class="l">最新价 ' + arrow + (p.change_pct >= 0 ? '+' : '') + (p.change_pct * 100).toFixed(2) + '%</div></div>' +
                    '<div class="stock-stat"><div class="v">¥' + p.high.toFixed(2) + '</div><div class="l">最高</div></div>' +
                    '<div class="stock-stat"><div class="v">¥' + p.low.toFixed(2) + '</div><div class="l">最低</div></div>';
            } else {
                stats.innerHTML = '<div class="stock-stat" style="grid-column:1/-1"><div class="l">实时行情暂不可用</div></div>';
            }
            const h = document.getElementById('modalHolders');
            if (d.holders && d.holders.length > 0) {
                h.innerHTML = d.holders.map(function(h) {
                    return '<div style="padding:5px 0;border-bottom:1px solid rgba(30,45,69,.3)"><a href="/trader/' + h.trader_id + '" style="color:var(--accent)">' + h.trader_name + '</a> <span style="color:var(--text3)">' + h.shares + '股 @¥' + h.cost.toFixed(2) + '</span></div>';
                }).join('');
            } else {
                h.innerHTML = '<span style="color:var(--text3)">无操盘手持仓该股</span>';
            }

            const pel = document.getElementById('modalPE');
            const pbl = document.getElementById('modalPB');
            if (d.pe) {
                var peLevel = d.pe < 15 ? '<span style="color:var(--green)">偏低</span>' :
                              d.pe > 30 ? '<span style="color:var(--red)">偏高</span>' :
                              '<span style="color:var(--yellow)">适中</span>';
                pel.innerHTML = '<strong>PE:</strong> ' + d.pe.toFixed(1) + ' ' + peLevel;
            } else {
                pel.innerHTML = '<strong>PE:</strong> 暂无数据';
            }
            if (d.pb) {
                var pbLevel = d.pb < 1 ? '<span style="color:var(--green)">破净</span>' :
                              d.pb < 3 ? '<span style="color:var(--yellow)">合理</span>' :
                              '<span style="color:var(--red)">偏高</span>';
                pbl.innerHTML = '<strong>PB:</strong> ' + d.pb.toFixed(2) + ' ' + pbLevel;
            } else {
                pbl.innerHTML = '<strong>PB:</strong> 暂无数据';
            }
        } catch (e) {
            document.getElementById('modalTitle').textContent = '加载失败';
        }
    }
    function closeModal() {
        document.getElementById('stockModal').classList.remove('show');
    }

    // ── Reason Translator ──
    function translateReason(raw) {
        if (!raw) return '';
        var t = raw
            .replace(/PE=([\d.]+)/g, '市盈率$1倍')
            .replace(/PB=([\d.]+)/g, '市净率$1倍')
            .replace(/RSI=([\d.]+)/g, '超买超卖指标$1')
            .replace(/MA5\(([\d.]+).*MA20\(([\d.]+)/g, '5日均价$1上穿20日均价$2(金叉买入)')
            .replace(/金叉放量/g, '金叉+成交量放大，上涨趋势确立')
            .replace(/死叉/g, '死叉，下跌趋势确立')
            .replace(/低估值/g, '股价低于行业平均，被低估')
            .replace(/止盈:/g, '达到止盈目标:')
            .replace(/止损:/g, '达到止损线:')
            .replace(/超卖反弹/g, '短期超跌，预计反弹')
            .replace(/再平衡/g, '调整仓位到目标比例');
        return t;
    }

    // ── Data Source Health Check ──
    (function checkHealth() {
        var el = document.getElementById('dsStatus');
        fetch('/api/health').then(function(r) { return r.json(); }).then(function(h) {
            var parts = [];
            // 行情 = 实时价：多源链（腾讯优先、新浪兜底）；h.sina 是纯新浪单源，
            // 两者都会在部分节点单边失效，任一可用即算行情可用。
            var rt = h.realtime || h.sina;
            // 历史 = 日线/PE/PB：HTTP 源为主，baostock 只是兜底。
            var hist = h.history || h.baostock;
            parts.push(rt ? '🟢 行情' : '🔴 行情');
            parts.push(hist ? '🟢 历史' : '🔴 历史');
            parts.push(h.tushare ? '🟢 财务' : '⚪ 财务');
            el.textContent = parts.join(' ');
            el.title = '数据源　行情(实时价)：' + (rt ? '可用' : '不可用')
                     + '　历史(日线/PE/PB)：' + (hist ? '可用' : '不可用')
                     + '　财务(tushare)：' + (h.tushare ? '可用' : '未配置');
        }).catch(function() {
            el.textContent = '⚠ 离线';
        });
    })();

    // ── 应用保活 ──
    // PocketBay 会把闲置应用休眠（再次访问时先显示"此应用正在休眠"）。若休眠发生在
    // 用户浏览过程中，页面内的跳转请求会被挂住，表现就是"点了没反应"。
    // 页面可见且用户仍在操作时定时打一次轻量端点，避免中途被休眠；
    // 连续 30 分钟无任何操作则停止保活，让应用正常休眠（不长期占资源）。
    (function keepAlive() {
        var IDLE_LIMIT = 30 * 60 * 1000;
        var PING_INTERVAL = 120 * 1000;
        var lastActive = Date.now();
        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (ev) {
            window.addEventListener(ev, function () { lastActive = Date.now(); }, { passive: true });
        });
        function ping() { fetch('/api/ping', { cache: 'no-store' }).catch(function () {}); }
        setInterval(function () {
            if (document.hidden) return;
            if (Date.now() - lastActive > IDLE_LIMIT) return;
            ping();
        }, PING_INTERVAL);
        // 从后台切回来时立刻探一次，把可能已休眠的应用叫醒，避免紧接着的点击被挂住
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { lastActive = Date.now(); ping(); }
        });
    })();

    // ── 异步站内导航（局部加载） ──
    // 痛点：站内跳转在 iframe 内是「整页导航」。请求一旦被挂住（应用被平台休眠 /
    // 冷启动 / 服务端首次计算行情），旧界面完全静止，用户只能猜「是不是网断了」。
    // 做法：拦截站内链接 → 立即进入可见加载态 → fetch 目标页 HTML → 只替换 #page-root
    // 并按序重放页面脚本 → pushState 更新 URL。任一环节不符合预期就回退整页导航，
    // 保证「最坏情况也不比原来更差」。
    (function asyncNav() {
        var root = document.getElementById('page-root');
        var scriptHost = document.getElementById('page-scripts');
        if (!root || !scriptHost || !window.fetch || !window.history || !window.DOMParser) return;

        var CACHE_TTL = 10000;   // 悬停预取命中窗口：10s 内数据等价，用来换「秒开」
        var TIMEOUT = 30000;     // 单次请求上限（线上冷启动实测最长约 10s）
        var MAX_TRIES = 2;       // 超时后重试 1 次（顺带把可能已休眠的应用叫醒）
        var HOVER_DELAY = 260;   // 悬停多久才预取，避免划过就连锁触发
        var cache = {};          // key -> { t, html }
        var pending = null;      // 当前导航的 AbortController
        var prefetchKey = null;  // 预取串行：单进程容器，绝不并发压多个重计算页面
        var bar = null, overlay = null, phaseTimer = null, startedAt = 0, failsafe = null;
        var reloading = false;

        // ── 加载态：顶部进度条（不确定进度）+ 遮罩文案 ──
        function ensureUI() {
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'navProgress';
                bar.innerHTML = '<i></i>';
                document.body.appendChild(bar);
            }
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'navLoading';
                overlay.setAttribute('role', 'status');
                overlay.setAttribute('aria-live', 'polite');
                overlay.innerHTML = '<div class="nav-loading-box">'
                                  + '<span class="nav-loading-spin"></span>'
                                  + '<span id="navLoadingMsg"></span>'
                                  + '<span id="navLoadingActions" hidden>'
                                  +   '<a class="nav-retry" id="navRetryLink">重试</a>'
                                  +   '<button class="nav-retry" id="navRetryReload" type="button">刷新整页</button>'
                                  + '</span>'
                                  + '</div>';
                document.body.appendChild(overlay);
                var reloadBtn = overlay.querySelector('#navRetryReload');
                if (reloadBtn) reloadBtn.addEventListener('click', function () { location.reload(); });
            }
        }

        function setMsg(txt) {
            var el = document.getElementById('navLoadingMsg');
            if (el) el.textContent = txt;
        }

        // 分阶段文案：让用户随时知道"还在动"，而不是静止等待。
        function phaseText(sec) {
            if (sec >= 15) return '仍在等待服务器响应…';
            if (sec >= 7) return '应用可能正在唤醒，请稍候…';
            if (sec >= 2.5) return '正在计算行情数据…';
            return '正在加载…';
        }

        function showLoading(label) {
            ensureUI();
            startedAt = Date.now();
            reloading = false;
            overlay.classList.remove('stuck');
            var acts = document.getElementById('navLoadingActions');
            if (acts) acts.hidden = true;
            bar.classList.add('on');
            overlay.classList.add('on');
            root.classList.add('busy');
            root.setAttribute('aria-busy', 'true');
            setMsg(label || '正在加载…');
            if (phaseTimer) clearInterval(phaseTimer);
            phaseTimer = setInterval(function () {
                var sec = (Date.now() - startedAt) / 1000;
                var txt = phaseText(sec);
                if (sec >= 2) txt += '（已等待 ' + Math.floor(sec) + 's）';
                setMsg(txt);
            }, 250);
            // 安全阀：任何异常路径都不会把加载态永久留在页面上
            if (failsafe) clearTimeout(failsafe);
            failsafe = setTimeout(function () { hideLoading(); }, 60000);
        }

        function hideLoading() {
            if (phaseTimer) { clearInterval(phaseTimer); phaseTimer = null; }
            if (failsafe) { clearTimeout(failsafe); failsafe = null; }
            if (bar) bar.classList.remove('on');
            if (overlay) {
                overlay.classList.remove('on');
                overlay.classList.remove('stuck');
            }
            var acts = document.getElementById('navLoadingActions');
            if (acts) acts.hidden = true;
            root.classList.remove('busy');
            root.removeAttribute('aria-busy');
        }

        function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

        // 尾斜杠归一化：`/screening` 与 `/screening/` 视为同一页。
        // 服务端两种形态都可能出现（有路由按 `/xxx/` 注册过），不归一化会出现
        // 「已经在漏斗页、再点漏斗又被当成新跳转」以及导航高亮匹配不上的问题。
        function normPath(p) {
            if (!p) return p;
            if (p.length > 1 && p.charAt(p.length - 1) === '/') return p.slice(0, -1);
            return p;
        }

        // 把绝对/相对 URL 归一成「路径 + 查询串」，作为导航键与地址栏内容。
        function keyOf(u) {
            try {
                var x = new URL(u, location.href);
                return x.pathname + x.search;
            } catch (e) { return null; }
        }

        // 点击后立刻把选中项点亮：先给"我收到了"的反馈，再谈加载快慢。
        function markPending(a) {
            var links = document.querySelectorAll('nav .nav-group a');
            for (var i = 0; i < links.length; i++) links[i].classList.remove('active', 'nav-pending');
            if (a) a.classList.add('nav-pending');
        }

        function clearPending() {
            var links = document.querySelectorAll('nav .nav-group a.nav-pending');
            for (var i = 0; i < links.length; i++) links[i].classList.remove('nav-pending');
        }

        function setActiveNav(path) {
            var want = normPath(path);
            var links = document.querySelectorAll('nav .nav-group a');
            var matched = false, target = null;
            for (var i = 0; i < links.length; i++) {
                var p = links[i].getAttribute('href') || '';
                if (p === '/' && want === '/') { target = links[i]; matched = true; break; }
                if (p !== '/' && normPath(p) === want) { target = links[i]; matched = true; break; }
                // 详情页（/stock/x、/trader/x）无对应导航项，保持原有高亮不变
                if (p !== '/' && want.indexOf(normPath(p) + '/') === 0) { target = links[i]; matched = true; break; }
            }
            if (!matched) return;
            for (var j = 0; j < links.length; j++) links[j].classList.remove('active', 'nav-pending');
            target.classList.add('active');
        }

        // ── 页面脚本重放 ──
        // 顶层 let/const 会进入全局词法环境，同一文档里二次注入会抛
        // "Identifier 'x' has already been declared"。这些模板的顶层声明都写在行首
        // （缩进为 0），而函数体内的声明都有缩进 —— 只把行首的 let/const 降级为 var，
        // 语义等价且可重复声明，函数体内的块级作用域原样保留、行为不变。
        function deLexicalize(code) {
            return code.replace(/^(let|const)([ \t]+)/gm, 'var$2');
        }

        function runScripts(codes, url) {
            var blocks = codes.filter(function (c) { return c && c.trim(); });
            if (!blocks.length) return;
            var guard = function (ev) {
                var msg = String((ev && (ev.message || ev.error)) || '');
                // 只在"声明冲突"这类确定性 SyntaxError 上回退：整页导航必然能修好；
                // 其它运行时错误即使整页重载也一样，回退只会造成无意义的刷新。
                if (/already been declared|SyntaxError/i.test(msg)) fallbackReload(url);
            };
            window.addEventListener('error', guard);
            try {
                // 按块独立注入，与原生多个 <script> 的语义一致：一块出错不牵连其它块
                for (var i = 0; i < blocks.length; i++) {
                    var node = document.createElement('script');
                    node.textContent = deLexicalize(blocks[i]);
                    document.body.appendChild(node);
                    if (node.parentNode) node.parentNode.removeChild(node);
                }
            } finally {
                setTimeout(function () { window.removeEventListener('error', guard); }, 3000);
            }
        }

        function fallbackReload(url) {
            if (reloading) return;
            reloading = true;
            setMsg('正在重新载入…');
            var target = url.pathname + url.search;
            var before = location.href;
            // 先挂探针再导航：整页导航也可能被环境拦住（平台网关策略、浏览器
            // 按混合内容拦截等），此时文档不会变，页面就会永远停在加载态 ——
            // 那正是用户口中的"点了没反应"。超时必须先注册，因为 assign 本身
            // 也可能直接抛错，那样就再没有任何东西能把页面救回来了。
            setTimeout(function () {
                if (location.href === before) showStuck(target);
            }, 4000);
            try {
                location.assign(target);
            } catch (e) {
                showStuck(target);
            }
        }

        // 跳转被拦住时：加载态转为"可操作"状态（文案 + 重试入口）
        function showStuck(target) {
            ensureUI();
            reloading = false;
            overlay.classList.add('on');
            overlay.classList.add('stuck');
            setMsg('页面未能自动载入，可手动重试。');
            var link = document.getElementById('navRetryLink');
            if (link) link.setAttribute('href', target);
            var acts = document.getElementById('navLoadingActions');
            if (acts) acts.hidden = false;
        }

        // ── 把拉到的 HTML 应用上去 ──
        // finalUrl：fetch 跟随重定向后的最终地址（没有重定向时等于请求地址）。
        // 地址栏以它为准，避免"服务端 3xx 到别处、地址栏却还写着原路径"。
        function apply(html, url, opts, finalUrl) {
            var doc;
            try { doc = new DOMParser().parseFromString(html, 'text/html'); } catch (e) { return false; }
            var newRoot = doc && doc.getElementById('page-root');
            if (!newRoot || !newRoot.innerHTML.trim()) return false;
            // 地址栏目标：优先用最终响应地址（重定向后才是真实页面）
            var target = keyOf(finalUrl) || (url.pathname + url.search);

            var body = doc.getElementById('page-scripts');
            // 页面 <script> 可能与内容同处一块（screening.html 就在 content 里），
            // 所以先把内容放进去，再收集并摘除其中的 <script> 统一执行。
            root.innerHTML = newRoot.innerHTML;
            var inline = root.querySelectorAll('script');
            var codes = [];
            for (var i = 0; i < inline.length; i++) {
                codes.push(inline[i].textContent || '');
                inline[i].parentNode.removeChild(inline[i]);
            }
            if (body) {
                var outer = body.querySelectorAll('script');
                for (var k = 0; k < outer.length; k++) codes.push(outer[k].textContent || '');
            }

            var t = doc.querySelector('title');
            if (t && t.textContent) document.title = t.textContent;

            // 弹窗是共享外壳、在交换边界之外，不关掉会留下上一页的残留内容
            if (typeof closeModal === 'function') closeModal();
            if (typeof closeConfirm === 'function') closeConfirm();

            clearPending();
            setActiveNav(normPath(target.split('?')[0]));
            if (opts.scroll !== false) window.scrollTo(0, 0);
            if (opts.push !== false) history.pushState({ pn: 1 }, '', target);

            runScripts(codes, url);
            return true;
        }

        // ── 取页面（带超时 / 返回最终地址） ──
        function fetchHTML(key, signal) {
            return fetch(key, {
                signal: signal,
                credentials: 'same-origin',
                cache: 'no-store',
                headers: { 'Accept': 'text/html,application/xhtml+xml', 'X-Partial-Nav': '1' }
            }).then(function (resp) {
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var ct = resp.headers.get('content-type') || '';
                if (ct.indexOf('html') < 0) throw new Error('非 HTML 响应：' + ct);
                // resp.url 是跟随重定向后的最终地址，绝不能假定它等于请求地址：
                // 服务端回 3xx 时 Location 可能是绝对 URL（线上曾出现明文 http://，
                // 被浏览器当混合内容拦掉），拿到最终地址才能正确记账并暴露问题。
                return resp.text().then(function (html) {
                    return { html: html, finalUrl: resp.url || key };
                });
            });
        }

        function navigate(url, opts) {
            opts = opts || {};
            var key = url.pathname + url.search;
            if (pending) { try { pending.abort(); } catch (e) {} }
            var ctrl = new AbortController();
            pending = ctrl;

            // 悬停预取命中：直接渲染（10s 窗口内数据等价），换来真正的"秒开"
            var hit = cache[key];
            if (hit && Date.now() - hit.t < CACHE_TTL) {
                delete cache[key];
                if (apply(hit.html, url, opts, hit.finalUrl)) { pending = null; return; }
            }

            showLoading(opts.label ? '正在加载 ' + opts.label + '…' : '正在加载…');
            var tries = 0;

            function attempt() {
                tries++;
                var timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, TIMEOUT);
                return fetchHTML(key, ctrl.signal).then(function (res) {
                    clearTimeout(timer);
                    if (apply(res.html, url, opts, res.finalUrl)) {
                        pending = null;
                        hideLoading();
                        return true;
                    }
                    throw new Error('页面结构不符合预期');
                }).catch(function (err) {
                    clearTimeout(timer);
                    if (tries < MAX_TRIES) {
                        setMsg('加载较慢，正在重试…');
                        ctrl = new AbortController();
                        pending = ctrl;
                        return sleep(1200).then(attempt);
                    }
                    // 兜底：整页导航。加载态保留到新文档接管，用户始终看得见反馈。
                    fallbackReload(url);
                    return true;
                });
            }

            return attempt();
        }

        // ── 链接判定：只接管同源站内页面 ──
        function resolve(a) {
            var href = a.getAttribute('href');
            if (!href || href.charAt(0) === '#') return null;
            if (a.hasAttribute('download') || a.hasAttribute('data-no-partial')) return null;
            if (a.target && a.target !== '_self') return null;
            if (a.rel && /external/i.test(a.rel)) return null;
            var u;
            try { u = new URL(a.href, location.href); } catch (e) { return null; }
            if (u.origin !== location.origin) return null;
            var p = u.pathname;
            if (p.indexOf('/api/') === 0 || p.indexOf('/static/') === 0 || p.indexOf('/.pocketbay/') === 0) return null;
            if (/\.(png|jpe?g|gif|svg|ico|css|js|json|csv|xlsx?|pdf|zip|txt)$/i.test(p)) return null;
            // 已在目标页（含尾斜杠同义形态）就不必再走一次跳转
            if (normPath(u.pathname) === normPath(location.pathname) && u.search === location.search) return null;
            return u;
        }

        // ── 事件绑定 ──
        document.addEventListener('click', function (e) {
            if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            var a = e.target && e.target.closest ? e.target.closest('a') : null;
            if (!a) return;
            var u = resolve(a);
            if (!u) return;
            e.preventDefault();
            markPending(a);
            var label = (a.getAttribute('aria-label') || a.textContent || '').replace(/\s+/g, ' ').trim();
            navigate(u, { push: true, label: label });
        }, false);

        // 表单是"动作"（下单/改配置），语义保持整页提交，但同样给可见反馈
        document.addEventListener('submit', function (e) {
            if (e.defaultPrevented || reloading) return;
            showLoading('正在提交…');
        }, false);

        window.addEventListener('popstate', function () {
            var u;
            try { u = new URL(location.href); } catch (e) { return; }
            navigate(u, { push: false });
        });
        try { history.replaceState({ pn: 1 }, '', location.href); } catch (e) {}

        // ── 悬停预取：把"等待渲染"提前到用户还在移动鼠标的时候 ──
        if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
            var hoverTimer = null;
            document.addEventListener('mouseover', function (e) {
                var a = e.target && e.target.closest ? e.target.closest('a') : null;
                if (!a) return;
                var u = resolve(a);
                if (!u) return;
                var key = u.pathname + u.search;
                if (cache[key] && Date.now() - cache[key].t < CACHE_TTL) return;
                if (hoverTimer) clearTimeout(hoverTimer);
                hoverTimer = setTimeout(function () { prefetch(key); }, HOVER_DELAY);
            }, { passive: true });
            document.addEventListener('mouseout', function () {
                if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
            }, { passive: true });
        }

        function prefetch(key) {
            if (prefetchKey || pending) return;   // 串行：宁可少预取，也不并发压服务器
            prefetchKey = key;
            var ctrl = new AbortController();
            var timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, TIMEOUT);
            fetchHTML(key, ctrl.signal).then(function (res) {
                // 连最终地址一起缓存：命中缓存时地址栏同样要对得上
                cache[key] = { t: Date.now(), html: res.html, finalUrl: res.finalUrl };
                var keys = Object.keys(cache);
                if (keys.length > 4) delete cache[keys[0]];
            }).catch(function () {}).then(function () {
                clearTimeout(timer);
                prefetchKey = null;
            });
        }
    })();
    </script>
</body>
</html>
